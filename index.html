<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OneHub — Your Unified Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07080f;
  --dock-bg: rgba(12,15,26,0.96);
  --win-bg: rgba(11,14,24,0.97);
  --win-bar: rgba(16,20,34,1);
  --border: rgba(255,255,255,0.07);
  --border-h: rgba(255,255,255,0.14);
  --accent: #4f8ef7;
  --accent2: #a78bfa;
  --text: rgba(255,255,255,0.92);
  --muted: rgba(255,255,255,0.4);
  --glass: rgba(255,255,255,0.04);
  --close: #ff5f57;
  --mini: #febc2e;
  --maxi: #28c840;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Outfit',sans-serif;background:var(--bg);color:var(--text);user-select:none;}

#pcanvas{position:fixed;inset:0;pointer-events:none;z-index:0;}

/* ===== INTRO ===== */
#intro{
  position:fixed;inset:0;z-index:9999;
  background:radial-gradient(ellipse at 50% 55%,#0b1632 0%,#040609 55%,#000 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity 1.1s cubic-bezier(0.4,0,0.2,1),transform 1.1s cubic-bezier(0.4,0,0.2,1);
}
#intro.exit{opacity:0;pointer-events:none;transform:scale(1.06);}

.ring{
  position:absolute;border-radius:50%;
  border:1px solid rgba(79,142,247,0.12);
  animation:ringAnim 4s ease-out infinite;
}
.ring:nth-child(1){width:180px;height:180px;animation-delay:0s;}
.ring:nth-child(2){width:320px;height:320px;animation-delay:0.6s;}
.ring:nth-child(3){width:480px;height:480px;animation-delay:1.2s;}
.ring:nth-child(4){width:640px;height:640px;animation-delay:1.8s;}
.ring:nth-child(5){width:800px;height:800px;animation-delay:2.4s;}
@keyframes ringAnim{
  0%{opacity:0.7;transform:scale(0.85);}
  100%{opacity:0;transform:scale(1.15);}
}

#intro-content{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;
  animation:fadeUp 0.9s ease 0.2s both;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(24px);}
  to{opacity:1;transform:translateY(0);}
}

#intro-icon{
  width:88px;height:88px;border-radius:28px;
  background:linear-gradient(145deg,#1a3a8f,#4f46e5);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 80px rgba(79,142,247,0.45),0 0 160px rgba(79,142,247,0.15),inset 0 1px 0 rgba(255,255,255,0.2);
  animation:iconPulse 2.5s ease-in-out infinite alternate;
  margin-bottom:6px;
}
@keyframes iconPulse{
  from{box-shadow:0 0 50px rgba(79,142,247,0.35),0 0 100px rgba(79,142,247,0.1),inset 0 1px 0 rgba(255,255,255,0.2);}
  to{box-shadow:0 0 100px rgba(79,142,247,0.6),0 0 200px rgba(79,142,247,0.25),inset 0 1px 0 rgba(255,255,255,0.2);}
}

#intro-title{
  font-family:'Syne',sans-serif;font-size:58px;font-weight:800;letter-spacing:-2px;
  background:linear-gradient(135deg,#ffffff 20%,#6baeff 55%,#b59fff 85%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:fadeUp 0.9s ease 0.45s both;
}
#intro-sub{
  font-size:16px;color:rgba(255,255,255,0.42);font-weight:300;letter-spacing:0.4px;
  animation:fadeUp 0.9s ease 0.6s both;
}

#intro-prog-wrap{margin-top:44px;width:260px;animation:fadeUp 0.9s ease 0.75s both;}
#intro-prog-track{width:100%;height:2px;background:rgba(255,255,255,0.07);border-radius:2px;overflow:hidden;}
#intro-prog-bar{
  height:100%;width:0%;border-radius:2px;
  background:linear-gradient(90deg,#4f8ef7,#a78bfa);
  transition:width 0.12s linear;
  box-shadow:0 0 12px rgba(79,142,247,0.8);
}
#intro-prog-label{text-align:center;font-size:12px;color:rgba(255,255,255,0.3);margin-top:12px;letter-spacing:0.6px;}

/* ===== APP SHELL ===== */
#app{position:fixed;inset:0;display:none;flex-direction:row;z-index:1;}

/* ===== DOCK ===== */
#dock{
  width:66px;height:100%;flex-shrink:0;
  background:var(--dock-bg);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;
  padding:12px 0 12px;gap:0;
  position:relative;z-index:200;
}

.dock-top{display:flex;flex-direction:column;align-items:center;gap:6px;padding-bottom:8px;width:100%;}
.dock-divider{width:36px;height:1px;background:var(--border);flex-shrink:0;margin:5px 0;}
#dock-icons{
  flex:1;overflow-y:auto;overflow-x:visible;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:4px 0;width:100%;scrollbar-width:none;
}
#dock-icons::-webkit-scrollbar{display:none;}
.dock-bottom{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:8px;width:100%;}

.dock-btn{
  width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;border:none;background:var(--glass);color:var(--muted);
  transition:all 0.2s ease;flex-shrink:0;position:relative;
}
.dock-btn:hover{background:rgba(255,255,255,0.1);color:var(--text);transform:scale(1.08);}
.dock-btn svg{width:19px;height:19px;pointer-events:none;}

/* Dock icon */
.dicon{
  width:46px;height:46px;border-radius:14px;overflow:hidden;
  cursor:pointer;position:relative;flex-shrink:0;
  transition:all 0.22s cubic-bezier(0.34,1.56,0.64,1);
  border:1.5px solid transparent;
}
.dicon:hover{transform:scale(1.18) translateX(3px);border-color:var(--border-h);}
.dicon.open-win{border-color:rgba(79,142,247,0.5);box-shadow:0 0 14px rgba(79,142,247,0.25);}
.dicon img{width:100%;height:100%;object-fit:cover;display:block;}
.dicon .dot{
  position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%;background:var(--accent);
  opacity:0;transition:opacity 0.2s;
}
.dicon.open-win .dot{opacity:1;}

/* Tooltip */
.dicon::after{
  content:attr(data-name);
  position:absolute;left:calc(100% + 14px);top:50%;transform:translateY(-50%);
  background:rgba(8,12,24,0.96);border:1px solid var(--border-h);
  color:var(--text);font-size:12px;font-family:'Outfit',sans-serif;font-weight:500;
  padding:5px 11px;border-radius:9px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity 0.15s ease;
  z-index:999;
}
.dicon:hover::after{opacity:1;}

/* ===== WORKSPACE ===== */
#workspace{
  flex:1;position:relative;overflow:hidden;
  background:
    radial-gradient(ellipse at 20% 20%,rgba(79,142,247,0.04) 0%,transparent 55%),
    radial-gradient(ellipse at 80% 80%,rgba(167,139,250,0.04) 0%,transparent 55%);
}

#ws-empty{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  transition:opacity 0.3s;pointer-events:none;
}
#ws-empty.gone{opacity:0;}
#ws-empty-ico{opacity:0.12;}
#ws-empty-text{font-size:14px;color:var(--muted);text-align:center;line-height:1.7;}
#ws-empty-hint{
  display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,0.2);margin-top:4px;
}
.kbd{
  padding:2px 7px;border:1px solid rgba(255,255,255,0.12);
  border-radius:5px;font-size:11px;font-family:'Outfit',sans-serif;
  background:rgba(255,255,255,0.04);
}

/* ===== WINDOW ===== */
.win{
  position:absolute;min-width:300px;min-height:220px;
  background:var(--win-bg);border:1px solid var(--border);
  border-radius:16px;overflow:hidden;
  display:flex;flex-direction:column;
  box-shadow:0 28px 80px rgba(0,0,0,0.65),0 0 0 0.5px rgba(255,255,255,0.03);
  transition:box-shadow 0.2s ease;
  animation:winIn 0.28s cubic-bezier(0.34,1.2,0.64,1) forwards;
}
@keyframes winIn{
  from{opacity:0;transform:scale(0.92) translateY(10px);}
  to{opacity:1;transform:scale(1) translateY(0);}
}
.win.top{box-shadow:0 32px 100px rgba(0,0,0,0.75),0 0 0 1px var(--border-h),0 0 50px rgba(79,142,247,0.05);}
.win.minimized{display:none;}

.winbar{
  height:40px;background:var(--win-bar);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 12px;gap:8px;
  cursor:grab;flex-shrink:0;
}
.winbar:active{cursor:grabbing;}
.winctrls{display:flex;gap:7px;margin-right:4px;}
.wc{
  width:12px;height:12px;border-radius:50%;cursor:pointer;
  border:none;padding:0;transition:filter 0.15s;flex-shrink:0;
  position:relative;
}
.wc:hover{filter:brightness(1.25);}
.wc:hover::before{
  content:'';position:absolute;inset:0;border-radius:50%;
  background:rgba(0,0,0,0.25);
}
.wc.cl{background:var(--close);}
.wc.mi{background:var(--mini);}
.wc.ma{background:var(--maxi);}
.wicon{width:18px;height:18px;border-radius:5px;overflow:hidden;flex-shrink:0;}
.wicon img{width:100%;height:100%;object-fit:cover;}
.wtitle{font-size:12px;font-weight:500;color:rgba(255,255,255,0.65);flex:1;pointer-events:none;}
.wurl{font-size:10px;color:var(--muted);margin-right:2px;pointer-events:none;}

.winbody{flex:1;overflow:hidden;position:relative;background:#0a0c14;}
.winbody iframe{width:100%;height:100%;border:none;background:#fff;display:block;}

/* Fallback content */
.wfallback{
  width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:12px;padding:28px;
  background:linear-gradient(160deg,rgba(18,23,42,1),rgba(10,12,20,1));
}
.wfallback-ico{width:60px;height:60px;border-radius:18px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.5);}
.wfallback-ico img{width:100%;height:100%;}
.wfallback-name{font-size:20px;font-weight:600;color:var(--text);}
.wfallback-host{font-size:13px;color:var(--muted);}
.wfallback-note{
  font-size:12px;color:rgba(255,255,255,0.22);text-align:center;
  max-width:260px;line-height:1.7;margin-top:4px;
}
.wf-btns{display:flex;flex-direction:column;gap:7px;align-items:center;width:100%;max-width:220px;}
.wf-primary{
  width:100%;padding:10px 0;border-radius:10px;font-size:13px;
  font-family:'Outfit',sans-serif;font-weight:500;
  background:var(--accent);color:#fff;border:none;cursor:pointer;
  transition:all 0.2s ease;
}
.wf-primary:hover{background:#3b7ee8;transform:translateY(-1px);}
.wf-secondary{
  width:100%;padding:8px 0;border-radius:10px;font-size:12px;
  font-family:'Outfit',sans-serif;background:transparent;
  color:rgba(255,255,255,0.35);border:1px solid rgba(255,255,255,0.1);cursor:pointer;
  transition:all 0.2s;
}
.wf-secondary:hover{color:rgba(255,255,255,0.6);border-color:rgba(255,255,255,0.2);}

/* Resize handles */
.rh{position:absolute;z-index:20;}
.rh.rn {top:-4px;left:16px;right:16px;height:8px;cursor:n-resize;}
.rh.rs {bottom:-4px;left:16px;right:16px;height:8px;cursor:s-resize;}
.rh.re {right:-4px;top:16px;bottom:16px;width:8px;cursor:e-resize;}
.rh.rw {left:-4px;top:16px;bottom:16px;width:8px;cursor:w-resize;}
.rh.rnw{top:-5px;left:-5px;width:14px;height:14px;cursor:nw-resize;}
.rh.rne{top:-5px;right:-5px;width:14px;height:14px;cursor:ne-resize;}
.rh.rsw{bottom:-5px;left:-5px;width:14px;height:14px;cursor:sw-resize;}
.rh.rse{bottom:-5px;right:-5px;width:14px;height:14px;cursor:se-resize;}

/* ===== SEARCH OVERLAY ===== */
#sovl{
  position:fixed;inset:0;z-index:800;
  display:flex;align-items:flex-start;justify-content:center;padding-top:72px;
  background:rgba(0,0,0,0.65);backdrop-filter:blur(5px);
  opacity:0;pointer-events:none;transition:opacity 0.2s ease;
}
#sovl.on{opacity:1;pointer-events:all;}

#spanel{
  width:540px;max-height:500px;
  background:rgba(14,18,32,0.99);border:1px solid var(--border-h);
  border-radius:20px;overflow:hidden;
  box-shadow:0 48px 120px rgba(0,0,0,0.85);
  transform:translateY(-8px) scale(0.97);
  transition:transform 0.22s cubic-bezier(0.34,1.2,0.64,1);
}
#sovl.on #spanel{transform:translateY(0) scale(1);}

#sinput-row{
  display:flex;align-items:center;gap:10px;padding:16px 18px;
  border-bottom:1px solid var(--border);
}
#sinput-row svg{width:18px;height:18px;color:var(--muted);flex-shrink:0;}
#sinput{
  flex:1;background:transparent;border:none;outline:none;
  font-size:16px;font-family:'Outfit',sans-serif;color:var(--text);font-weight:400;
}
#sinput::placeholder{color:rgba(255,255,255,0.25);}
#sresults{padding:6px;overflow-y:auto;max-height:420px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.1) transparent;}
#sresults::-webkit-scrollbar{width:4px;}
#sresults::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:4px;}

.scat{font-size:10px;color:rgba(255,255,255,0.28);font-weight:600;text-transform:uppercase;letter-spacing:0.08em;padding:8px 10px 3px;}
.sitem{
  display:flex;align-items:center;gap:12px;padding:9px 10px;
  border-radius:11px;cursor:pointer;transition:background 0.12s;
}
.sitem:hover{background:rgba(255,255,255,0.06);}
.sitem img{width:36px;height:36px;border-radius:10px;flex-shrink:0;border:1px solid rgba(255,255,255,0.05);}
.sitem-info{flex:1;}
.sitem-name{font-size:14px;font-weight:500;color:var(--text);}
.sitem-host{font-size:11px;color:var(--muted);}
.sitem-tag{
  font-size:11px;padding:3px 10px;border-radius:6px;
  border:1px solid var(--border);color:var(--muted);flex-shrink:0;
}
.sitem.is-open .sitem-tag{
  border-color:rgba(79,142,247,0.35);
  color:var(--accent);background:rgba(79,142,247,0.1);
}

/* ===== CONTEXT MENU ===== */
#ctx{
  position:fixed;z-index:1000;
  background:rgba(14,18,32,0.99);border:1px solid var(--border-h);
  border-radius:13px;padding:5px;min-width:176px;
  display:none;
  box-shadow:0 24px 70px rgba(0,0,0,0.75);
  animation:ctxIn 0.15s ease;
}
@keyframes ctxIn{from{opacity:0;transform:scale(0.94);}to{opacity:1;transform:scale(1);}}
.citem{
  padding:8px 12px;border-radius:8px;cursor:pointer;
  font-size:13px;display:flex;align-items:center;gap:9px;
  color:var(--text);transition:background 0.1s;
}
.citem:hover{background:rgba(255,255,255,0.07);}
.citem.red{color:#ff6b6b;}
.citem svg{width:15px;height:15px;flex-shrink:0;}
.cdiv{height:1px;background:var(--border);margin:3px 0;}
</style>
</head>
<body>

<canvas id="pcanvas"></canvas>

<!-- INTRO -->
<div id="intro">
  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
  </div>
  <div id="intro-content">
    <div id="intro-icon">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" width="52" height="52">
        <rect x="5" y="5" width="16" height="16" rx="4" fill="rgba(255,255,255,0.95)"/>
        <rect x="5" y="27" width="16" height="16" rx="4" fill="rgba(255,255,255,0.55)"/>
        <rect x="27" y="5" width="16" height="16" rx="4" fill="rgba(255,255,255,0.55)"/>
        <rect x="27" y="27" width="16" height="16" rx="4" fill="rgba(255,255,255,0.95)"/>
      </svg>
    </div>
    <div id="intro-title">OneHub</div>
    <div id="intro-sub">All your apps. One powerful workspace.</div>
    <div id="intro-prog-wrap">
      <div id="intro-prog-track"><div id="intro-prog-bar"></div></div>
      <div id="intro-prog-label">Preparing workspace…</div>
    </div>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div id="dock">
    <div class="dock-top">
      <button class="dock-btn" title="Search & Add Apps" onclick="toggleSearch()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
    </div>
    <div class="dock-divider"></div>
    <div id="dock-icons"></div>
    <div class="dock-divider"></div>
    <div class="dock-bottom">
      <button class="dock-btn" title="Add App" onclick="toggleSearch()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="workspace">
    <div id="ws-empty">
      <div id="ws-empty-ico">
        <svg viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg" width="96" height="96">
          <rect x="8" y="8" width="34" height="34" rx="7" fill="white" opacity="0.45"/>
          <rect x="8" y="54" width="34" height="34" rx="7" fill="white" opacity="0.2"/>
          <rect x="54" y="8" width="34" height="34" rx="7" fill="white" opacity="0.2"/>
          <rect x="54" y="54" width="34" height="34" rx="7" fill="white" opacity="0.45"/>
        </svg>
      </div>
      <div id="ws-empty-text">Click any icon in the dock to open an app<br>Drag windows, resize them, open many at once</div>
      <div id="ws-empty-hint">
        Press <span class="kbd">Ctrl K</span> to search &amp; add more apps
      </div>
    </div>
  </div>
</div>

<!-- SEARCH OVERLAY -->
<div id="sovl" onclick="closeSearchOutside(event)">
  <div id="spanel">
    <div id="sinput-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" id="sinput" placeholder="Search or add apps…" oninput="doSearch(this.value)" autocomplete="off"/>
    </div>
    <div id="sresults"></div>
  </div>
</div>

<!-- CONTEXT MENU -->
<div id="ctx">
  <div class="citem" id="ctx-open">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="18" height="18" rx="2.5"/><line x1="3" y1="9" x2="21" y2="9"/>
    </svg>Open in workspace
  </div>
  <div class="cdiv"></div>
  <div class="citem red" id="ctx-remove">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>Remove from dock
  </div>
</div>

<script>
// ─── APP REGISTRY ───────────────────────────────────────────
const APPS=[
  {id:'whatsapp',name:'WhatsApp',url:'https://web.whatsapp.com',icon:'https://www.google.com/s2/favicons?domain=web.whatsapp.com&sz=64',cat:'Messaging'},
  {id:'telegram',name:'Telegram',url:'https://web.telegram.org',icon:'https://www.google.com/s2/favicons?domain=web.telegram.org&sz=64',cat:'Messaging'},
  {id:'instagram',name:'Instagram',url:'https://www.instagram.com',icon:'https://www.google.com/s2/favicons?domain=instagram.com&sz=64',cat:'Social Media'},
  {id:'twitter',name:'X / Twitter',url:'https://x.com',icon:'https://www.google.com/s2/favicons?domain=x.com&sz=64',cat:'Social Media'},
  {id:'gmail',name:'Gmail',url:'https://mail.google.com',icon:'https://www.google.com/s2/favicons?domain=mail.google.com&sz=64',cat:'Email'},
  {id:'youtube',name:'YouTube',url:'https://www.youtube.com',icon:'https://www.google.com/s2/favicons?domain=youtube.com&sz=64',cat:'Entertainment'},
  {id:'drive',name:'Google Drive',url:'https://drive.google.com',icon:'https://www.google.com/s2/favicons?domain=drive.google.com&sz=64',cat:'Productivity'},
  {id:'gcalendar',name:'Google Calendar',url:'https://calendar.google.com',icon:'https://www.google.com/s2/favicons?domain=calendar.google.com&sz=64',cat:'Productivity'},
  {id:'notion',name:'Notion',url:'https://www.notion.so',icon:'https://www.google.com/s2/favicons?domain=notion.so&sz=64',cat:'Productivity'},
  {id:'figma',name:'Figma',url:'https://www.figma.com',icon:'https://www.google.com/s2/favicons?domain=figma.com&sz=64',cat:'Work'},
  {id:'github',name:'GitHub',url:'https://github.com',icon:'https://www.google.com/s2/favicons?domain=github.com&sz=64',cat:'Work'},
  {id:'slack',name:'Slack',url:'https://app.slack.com',icon:'https://www.google.com/s2/favicons?domain=slack.com&sz=64',cat:'Work'},
  {id:'meet',name:'Google Meet',url:'https://meet.google.com',icon:'https://www.google.com/s2/favicons?domain=meet.google.com&sz=64',cat:'Work'},
  {id:'linkedin',name:'LinkedIn',url:'https://www.linkedin.com',icon:'https://www.google.com/s2/favicons?domain=linkedin.com&sz=64',cat:'Social Media'},
  {id:'discord',name:'Discord',url:'https://discord.com/app',icon:'https://www.google.com/s2/favicons?domain=discord.com&sz=64',cat:'Messaging'},
  {id:'spotify',name:'Spotify',url:'https://open.spotify.com',icon:'https://www.google.com/s2/favicons?domain=open.spotify.com&sz=64',cat:'Entertainment'},
  {id:'reddit',name:'Reddit',url:'https://www.reddit.com',icon:'https://www.google.com/s2/favicons?domain=reddit.com&sz=64',cat:'Social Media'},
  {id:'maps',name:'Google Maps',url:'https://maps.google.com',icon:'https://www.google.com/s2/favicons?domain=maps.google.com&sz=64',cat:'Utility'},
  {id:'chatgpt',name:'ChatGPT',url:'https://chat.openai.com',icon:'https://www.google.com/s2/favicons?domain=openai.com&sz=64',cat:'AI Tools'},
  {id:'claude',name:'Claude',url:'https://claude.ai',icon:'https://www.google.com/s2/favicons?domain=claude.ai&sz=64',cat:'AI Tools'},
  {id:'paytm',name:'Paytm',url:'https://paytm.com',icon:'https://www.google.com/s2/favicons?domain=paytm.com&sz=64',cat:'Banking'},
  {id:'phonepay',name:'PhonePe',url:'https://www.phonepe.com',icon:'https://www.google.com/s2/favicons?domain=phonepe.com&sz=64',cat:'Banking'},
  {id:'sbi',name:'SBI Net Banking',url:'https://www.onlinesbi.sbi',icon:'https://www.google.com/s2/favicons?domain=onlinesbi.sbi&sz=64',cat:'Banking'},
  {id:'amazon',name:'Amazon',url:'https://www.amazon.in',icon:'https://www.google.com/s2/favicons?domain=amazon.in&sz=64',cat:'Shopping'},
  {id:'flipkart',name:'Flipkart',url:'https://www.flipkart.com',icon:'https://www.google.com/s2/favicons?domain=flipkart.com&sz=64',cat:'Shopping'},
  {id:'hotstar',name:'Hotstar',url:'https://www.hotstar.com',icon:'https://www.google.com/s2/favicons?domain=hotstar.com&sz=64',cat:'Entertainment'},
  {id:'netflix',name:'Netflix',url:'https://www.netflix.com',icon:'https://www.google.com/s2/favicons?domain=netflix.com&sz=64',cat:'Entertainment'},
];

let dockApps=['whatsapp','telegram','gmail','instagram','youtube','drive','notion'];
let windows={};
let zTop=100;
let winOffset=0;
let ctxAppId=null;

// ─── PARTICLES ──────────────────────────────────────────────
const cv=document.getElementById('pcanvas');
const cx2=cv.getContext('2d');
let pts=[];
function rzCv(){cv.width=innerWidth;cv.height=innerHeight;}
function mkPts(){
  rzCv();
  pts=Array.from({length:90},()=>({
    x:Math.random()*cv.width,y:Math.random()*cv.height,
    r:Math.random()*1.4+0.3,
    vx:(Math.random()-0.5)*0.25,vy:(Math.random()-0.5)*0.25,
    o:Math.random()*0.25+0.04
  }));
}
function drawPts(){
  cx2.clearRect(0,0,cv.width,cv.height);
  pts.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=cv.width;if(p.x>cv.width)p.x=0;
    if(p.y<0)p.y=cv.height;if(p.y>cv.height)p.y=0;
    cx2.beginPath();cx2.arc(p.x,p.y,p.r,0,Math.PI*2);
    cx2.fillStyle=`rgba(79,142,247,${p.o})`;cx2.fill();
  });
  requestAnimationFrame(drawPts);
}
window.addEventListener('resize',rzCv);
mkPts();drawPts();

// ─── INTRO ──────────────────────────────────────────────────
const MSGS=['Initializing workspace…','Loading your apps…','Enabling privacy shield…','Securing your session…','Welcome to OneHub ✦'];
function runIntro(){
  const bar=document.getElementById('intro-prog-bar');
  const lbl=document.getElementById('intro-prog-label');
  let pct=0,msgI=0;
  const iv=setInterval(()=>{
    pct+=Math.random()*6+2;
    if(pct>=100){pct=100;clearInterval(iv);}
    bar.style.width=pct+'%';
    const mi=Math.min(Math.floor(pct/100*MSGS.length),MSGS.length-1);
    if(mi!==msgI){msgI=mi;lbl.textContent=MSGS[msgI];}
    if(pct>=100){
      setTimeout(()=>{
        document.getElementById('intro').classList.add('exit');
        const app=document.getElementById('app');
        app.style.display='flex';
        app.style.opacity='0';
        app.style.transition='opacity 0.6s ease';
        requestAnimationFrame(()=>requestAnimationFrame(()=>{app.style.opacity='1';}));
        setTimeout(()=>document.getElementById('intro').remove(),1200);
        initApp();
      },600);
    }
  },75);
}

// ─── INIT ────────────────────────────────────────────────────
function initApp(){
  renderDock();
  renderSearch('');
}

// ─── DOCK ────────────────────────────────────────────────────
function renderDock(){
  const c=document.getElementById('dock-icons');
  c.innerHTML='';
  dockApps.forEach(id=>{
    const a=APPS.find(x=>x.id===id);if(!a)return;
    const el=document.createElement('div');
    el.className='dicon'+(windows[id]?' open-win':'');
    el.setAttribute('data-name',a.name);
    el.setAttribute('data-id',id);
    const fb=`data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23222'/><text x='32' y='40' text-anchor='middle' font-size='26' fill='white'>${a.name[0]}</text></svg>`)}`;
    el.innerHTML=`<img src="${a.icon}" alt="${a.name}" onerror="this.src='${fb}'"><div class="dot"></div>`;
    el.addEventListener('click',()=>{
      if(windows[id])focusWin(id);else openApp(id);
    });
    el.addEventListener('contextmenu',e=>{e.preventDefault();showCtx(e,id);});
    c.appendChild(el);
  });
}

// ─── CONTEXT MENU ────────────────────────────────────────────
function showCtx(e,id){
  ctxAppId=id;
  const m=document.getElementById('ctx');
  m.style.display='block';
  const x=Math.min(e.clientX+8,innerWidth-200);
  const y=Math.min(e.clientY,innerHeight-120);
  m.style.left=x+'px';m.style.top=y+'px';
  document.getElementById('ctx-open').onclick=()=>{openApp(id);hideCtx();};
  document.getElementById('ctx-remove').onclick=()=>{removeFromDock(id);hideCtx();};
}
function hideCtx(){document.getElementById('ctx').style.display='none';}
document.addEventListener('click',hideCtx);

function removeFromDock(id){
  dockApps=dockApps.filter(x=>x!==id);
  if(windows[id])closeWin(id);
  renderDock();
}

// ─── OPEN APP / WINDOW ───────────────────────────────────────
function openApp(id){
  if(windows[id]){focusWin(id);closeSearch();return;}
  const a=APPS.find(x=>x.id===id);if(!a)return;
  if(!dockApps.includes(id)){dockApps.push(id);renderDock();}

  const pad=50+(winOffset%6)*28;winOffset++;
  const ws=document.getElementById('workspace');
  const ww=Math.min(920,ws.offsetWidth*0.8);
  const wh=Math.min(620,ws.offsetHeight*0.8);
  const left=Math.min(pad,ws.offsetWidth-ww-20);
  const top=Math.min(pad,ws.offsetHeight-wh-20);

  const host=new URL(a.url).hostname;
  const fb=`data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23222'/><text x='32' y='40' text-anchor='middle' font-size='26' fill='white'>${a.name[0]}</text></svg>`)}`;

  const win=document.createElement('div');
  win.className='win top';
  win.id='win-'+id;
  win.style.cssText=`width:${ww}px;height:${wh}px;left:${left}px;top:${top}px;z-index:${++zTop}`;

  win.innerHTML=`
    <div class="winbar" id="wb-${id}">
      <div class="winctrls">
        <button class="wc cl" onclick="closeWin('${id}')" title="Close"></button>
        <button class="wc mi" onclick="miniWin('${id}')" title="Minimize"></button>
        <button class="wc ma" onclick="maxiWin('${id}')" title="Maximize"></button>
      </div>
      <div class="wicon"><img src="${a.icon}" alt="${a.name}" onerror="this.src='${fb}'"></div>
      <div class="wtitle">${a.name}</div>
      <div class="wurl">${host}</div>
    </div>
    <div class="winbody" id="wb2-${id}">
      <div class="wfallback">
        <div class="wfallback-ico"><img src="${a.icon}" alt="${a.name}" onerror="this.src='${fb}'"></div>
        <div class="wfallback-name">${a.name}</div>
        <div class="wfallback-host">${host}</div>
        <div class="wfallback-note">Most apps block embedding for security. Click to load ${a.name} inside this workspace, or open it in a new tab.</div>
        <div class="wf-btns">
          <button class="wf-primary" onclick="loadIframe('${id}')">Load ${a.name} here</button>
          <button class="wf-secondary" onclick="window.open('${a.url}','_blank')">Open in new tab ↗</button>
        </div>
      </div>
    </div>
    <div class="rh rnw" data-d="nw"></div>
    <div class="rh rne" data-d="ne"></div>
    <div class="rh rsw" data-d="sw"></div>
    <div class="rh rse" data-d="se"></div>
    <div class="rh rn"  data-d="n"></div>
    <div class="rh rs"  data-d="s"></div>
    <div class="rh re"  data-d="e"></div>
    <div class="rh rw"  data-d="w"></div>
  `;

  ws.appendChild(win);
  windows[id]={el:win,mini:false,maxi:false,prev:null};
  initDrag(win,document.getElementById('wb-'+id));
  initResize(win);
  win.addEventListener('mousedown',()=>focusWin(id));
  updateEmpty();
  renderDock();
  closeSearch();
}

function loadIframe(id){
  const a=APPS.find(x=>x.id===id);if(!a)return;
  document.getElementById('wb2-'+id).innerHTML=`<iframe src="${a.url}" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads" allow="camera; microphone; geolocation; clipboard-read; clipboard-write"></iframe>`;
}

function focusWin(id){
  Object.values(windows).forEach(w=>{if(w)w.el.classList.remove('top');});
  if(!windows[id])return;
  windows[id].el.classList.add('top');
  windows[id].el.style.zIndex=++zTop;
  if(windows[id].mini){
    windows[id].el.classList.remove('minimized');
    windows[id].mini=false;
    renderDock();
  }
}

function closeWin(id){
  if(!windows[id])return;
  const el=windows[id].el;
  el.style.transition='opacity 0.2s ease,transform 0.2s ease';
  el.style.opacity='0';el.style.transform='scale(0.94)';
  setTimeout(()=>{el.remove();delete windows[id];updateEmpty();renderDock();},200);
}

function miniWin(id){
  if(!windows[id])return;
  windows[id].el.classList.add('minimized');
  windows[id].mini=true;
  renderDock();
}

function maxiWin(id){
  if(!windows[id])return;
  const el=windows[id].el;
  const ws=document.getElementById('workspace');
  if(windows[id].maxi){
    const p=windows[id].prev;
    Object.assign(el.style,{left:p.l,top:p.t,width:p.w,height:p.h});
    windows[id].maxi=false;
  } else {
    windows[id].prev={l:el.style.left,t:el.style.top,w:el.style.width,h:el.style.height};
    Object.assign(el.style,{left:'0',top:'0',width:ws.offsetWidth+'px',height:ws.offsetHeight+'px'});
    windows[id].maxi=true;
  }
}

function updateEmpty(){
  const e=document.getElementById('ws-empty');
  Object.keys(windows).length>0?e.classList.add('gone'):e.classList.remove('gone');
}

// ─── DRAG ────────────────────────────────────────────────────
function initDrag(win,handle){
  let drag=false,sx,sy,sl,st;
  handle.addEventListener('mousedown',e=>{
    if(e.target.closest('.winctrls'))return;
    drag=true;sx=e.clientX;sy=e.clientY;
    sl=parseInt(win.style.left)||0;st=parseInt(win.style.top)||0;
    e.preventDefault();
  });
  document.addEventListener('mousemove',e=>{
    if(!drag)return;
    win.style.left=Math.max(0,sl+e.clientX-sx)+'px';
    win.style.top=Math.max(0,st+e.clientY-sy)+'px';
  });
  document.addEventListener('mouseup',()=>{drag=false;});
}

// ─── RESIZE ──────────────────────────────────────────────────
function initResize(win){
  win.querySelectorAll('.rh').forEach(h=>{
    h.addEventListener('mousedown',e=>{
      e.preventDefault();e.stopPropagation();
      const d=h.dataset.d;
      const sx=e.clientX,sy=e.clientY;
      const sw=win.offsetWidth,sh=win.offsetHeight;
      const sl=parseInt(win.style.left)||0,st=parseInt(win.style.top)||0;
      const mv=e=>{
        const dx=e.clientX-sx,dy=e.clientY-sy;
        if(d.includes('e'))win.style.width=Math.max(300,sw+dx)+'px';
        if(d.includes('s'))win.style.height=Math.max(220,sh+dy)+'px';
        if(d.includes('w')){const nw=Math.max(300,sw-dx);win.style.width=nw+'px';win.style.left=(sl+sw-nw)+'px';}
        if(d.includes('n')){const nh=Math.max(220,sh-dy);win.style.height=nh+'px';win.style.top=(st+sh-nh)+'px';}
      };
      const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);};
      document.addEventListener('mousemove',mv);
      document.addEventListener('mouseup',up);
    });
  });
}

// ─── SEARCH ──────────────────────────────────────────────────
function toggleSearch(){
  const o=document.getElementById('sovl');
  if(o.classList.contains('on')){closeSearch();}
  else{
    o.classList.add('on');
    setTimeout(()=>document.getElementById('sinput').focus(),80);
    renderSearch('');
  }
}
function closeSearch(){
  document.getElementById('sovl').classList.remove('on');
  document.getElementById('sinput').value='';
}
function closeSearchOutside(e){
  if(e.target===document.getElementById('sovl'))closeSearch();
}
function doSearch(q){renderSearch(q.toLowerCase().trim());}

function renderSearch(q){
  const c=document.getElementById('sresults');
  const all=q?APPS.filter(a=>a.name.toLowerCase().includes(q)||a.cat.toLowerCase().includes(q)||new URL(a.url).hostname.includes(q)):APPS;
  if(!all.length){c.innerHTML=`<div style="padding:24px;text-align:center;color:rgba(255,255,255,0.25);font-size:14px">No apps found</div>`;return;}
  const cats={};
  all.forEach(a=>{if(!cats[a.cat])cats[a.cat]=[];cats[a.cat].push(a);});
  c.innerHTML=Object.entries(cats).map(([cat,apps])=>`
    <div class="scat">${cat}</div>
    ${apps.map(a=>{
      const fb=`data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23222'/><text x='32' y='40' text-anchor='middle' font-size='26' fill='white'>${a.name[0]}</text></svg>`)}`;
      return `<div class="sitem ${windows[a.id]?'is-open':''}" onclick="openApp('${a.id}')">
        <img src="${a.icon}" alt="${a.name}" loading="lazy" onerror="this.src='${fb}'">
        <div class="sitem-info">
          <div class="sitem-name">${a.name}</div>
          <div class="sitem-host">${new URL(a.url).hostname}</div>
        </div>
        <div class="sitem-tag">${windows[a.id]?'Open':'Add'}</div>
      </div>`;
    }).join('')}
  `).join('');
}

// ─── KEYBOARD ────────────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();toggleSearch();}
  if(e.key==='Escape'){closeSearch();hideCtx();}
});

// ─── START ───────────────────────────────────────────────────
runIntro();
</script>
